# PM persona toolbelt — Persona Toolbelts plan (#3081), Lane A.
#
# The version-pinned, client-shareable declaration of what the PM persona
# ships with. Read cold, this file answers "Valor's PM runs with these tools,
# scoped this way." Seeded 2026-09-02 by enumerating the persona's ACTUAL
# ambient surface (faithful snapshot — activating enforcement changes
# nothing). Bump belt_version on EVERY edit; the resolver
# (agent/session_runner/belt_resolver.py) fails closed on a version it was
# not asked to expect.
#
# Stated plainly: belts are ergonomics and reproducibility, not a trust
# boundary. Headless turns run `--permission-mode bypassPermissions` (plan
# #2000 decision, reaffirmed by #3081 Open Question 2), so belt ABSENCE is
# the sole scoping mechanism, and the PM keeps open Bash by decision
# (#3081 No-Gos).

belt_version = 1

# why: the Claude CLI version this belt's flag semantics were validated
# against (#3081 Risk 2 — flag semantics can drift across CLI versions).
claude_cli_validated = "2.1.236"

[builtin]
# why: today's PM surface is the CLI's full built-in set — no --tools
# restriction has ever been applied to a headless turn, so the faithful
# snapshot is the CLI's own "default" sentinel (all built-in tools).
# Narrowing to an explicit list is a deliberate later edit, ranked by the
# Lane A baseline numbers, with a belt_version bump.
tools = "default"

# MCP servers: only the servers declared here load once enforcement is on
# (--strict-mcp-config). This is the repo-managed fleet surface installed on
# every machine by scripts/update/mcp_*.py; host-local extras in
# ~/.claude.json (e.g. design tools added by hand on one machine) are
# ambient drift, which is exactly what belts eliminate.

[mcp_servers.memory]
# why: subconscious-memory recall — the mcp__memory__memory_get /
# mcp__memory__memory_search tools that back <thought> stub expansion
# (docs/features/subconscious-memory.md). PYTHONPATH must point at the `ai`
# checkout itself, not at the session's cwd: scripts/update/mcp_memory.py::
# _expected_entry writes the ABSOLUTE repo root into ~/.claude.json, and most
# sessions run inside some other project's repo (projects.json maps a dozen),
# where a relative path holds no mcp_servers package. The shell expands $HOME
# at server launch, so this reproduces the installed entry from any working
# directory while staying byte-identical across hosts.
command = "/bin/sh"
args = ["-c", 'PYTHONPATH="$HOME/src/ai" exec python3 -m mcp_servers.memory_server']

[mcp_servers.byob]
# why: drive the user's real Chrome (browse, read, screenshot) via the BYOB
# bridge. scripts/update/mcp_byob.py::_resolve_tsx_bin registers whichever of
# two tsx layouts a machine's `bun install` produced — workspace-root first,
# package-local as fallback — so this line resolves the same two, in the same
# order. The byob-mcp.ts entrypoint has one location on every layout. The
# shell expands $HOME at server launch, so the declaration stays
# byte-identical across hosts.
command = "/bin/sh"
args = [
    "-c",
    'TSX="$HOME/.byob/node_modules/.bin/tsx"; [ -e "$TSX" ] || TSX="$HOME/.byob/packages/mcp-server/node_modules/.bin/tsx"; exec "$TSX" "$HOME/.byob/packages/mcp-server/bin/byob-mcp.ts"',
]
env = { BYOB_ALLOW_EVAL = "1" }

[permissions]
# why (allowed): empty — under bypassPermissions a permission allowlist is
# inert today; entries appear only when a tool must stay visible but scoped
# (compiled to --allowedTools).
allowed = []
# why (disallowed): empty — today no built-in tool is permission-blocked for
# the PM persona (compiled to --disallowedTools when non-empty).
disallowed = []
