<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valor, local</title>
<style>
  body { font: 15px/1.4 -apple-system, system-ui, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
  #log { flex: 1; overflow-y: auto; list-style: none; margin: 0; padding: 12px; }
  #log > li { margin: 6px 0; padding: 8px 10px; border-radius: 8px; max-width: 80%; overflow-wrap: anywhere; }
  #log > li > :first-child { margin-top: 0; }
  #log > li > :last-child { margin-bottom: 0; }
  #log p { margin: 0 0 0.6em; }
  #log h1, #log h2, #log h3, #log h4, #log h5, #log h6 { margin: 0.8em 0 0.4em; line-height: 1.25; }
  #log h1 { font-size: 1.25em; }
  #log h2 { font-size: 1.1em; }
  #log h3, #log h4, #log h5, #log h6 { font-size: 1em; }
  #log ul, #log ol { margin: 0 0 0.6em; padding-left: 1.4em; }
  #log ul { list-style: disc; }
  #log ol { list-style: decimal; }
  #log li li { margin: 0.15em 0; }
  #log code { font: 0.9em/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; background: rgba(0, 0, 0, 0.06); padding: 0.1em 0.3em; border-radius: 4px; }
  #log pre { background: rgba(0, 0, 0, 0.06); padding: 8px 10px; border-radius: 4px; overflow-x: auto; white-space: pre; margin: 0 0 0.6em; }
  #log pre code { background: none; padding: 0; }
  #log table { border-collapse: collapse; display: block; overflow-x: auto; margin: 0 0 0.6em; }
  #log th, #log td { border: 1px solid #d1d5db; padding: 4px 8px; text-align: left; }
  #log th { background: rgba(0, 0, 0, 0.04); }
  #log blockquote { margin: 0 0 0.6em; padding-left: 10px; border-left: 3px solid #d1d5db; color: #4b5563; }
  #log a[href] { color: #2563eb; }
  #log hr { border: 0; border-top: 1px solid #d1d5db; }
  #log > li.tom { background: #dbeafe; margin-left: auto; }
  #log > li.valor { background: #f3f4f6; cursor: pointer; }
  #log > li.chosen { outline: 2px solid #2563eb; }
  #status { padding: 4px 12px; color: #b91c1c; }
  #reply { padding: 4px 12px; color: #555; }
  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #ddd; }
  textarea { flex: 1; font: inherit; }
</style>
</head>
<body>
<ul id="log"></ul>
<div id="status"></div>
<div id="reply"></div>
<form id="form">
  <textarea id="text" rows="3" placeholder="Message Valor. Click one of Valor's messages to reply to it."></textarea>
  <button type="submit">Send</button>
</form>
<script src="/vendor/marked.umd.js"></script>
<script src="/vendor/purify.min.js"></script>
<script src="/chat.js"></script>
</body>
</html>
