# mondayflowers: served by the Pirate (one Mac per client), which runs the
# kernel. `client` follows the old config's owner; Tom may
# rename it.
name = "mondayflowers"
client = "mondayflowers"
repo = "https://github.com/yudame/mondayflowers.git"
kind = "django"
branch = "main"
merge_url = "https://github.com/yudame/mondayflowers.git"
# Its tests use Django's TestCase on Postgres (settings/vendor.py reads
# DATABASE_URL). settings/redis_db.py is imported by nothing, so no Redis.
services = ["postgres"]
# requirements.txt is unpinned, with no lock and no pytest-django, so the
# venv is built with pytest-django alongside; nothing is added to the repo.
# psycopg2's build needs pg_config and the SDK headers.
setup = [
    "uv venv -q --python 3.12",
    "PATH=\"$PATH:/opt/homebrew/opt/postgresql@18/bin\" SDKROOT=/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk uv pip install -q -r requirements.txt pytest-django",
]
# Red at main on 2026-10-16, with no test passing: test_models/test_note.py
# imports a Note model that no longer exists, test_behaviors.py collides
# with the test_behaviors/ package, and migration common.0008 names a
# dj-stripe migration the latest dj-stripe lacks. The kernel reads a base
# already red as the base's, not the candidate's.
suite = ".venv/bin/python -m pytest -p no:cacheprovider -q --ds=settings --continue-on-collection-errors --junitxml={junit} apps"
# CLAUDE.md names flake8 (in requirements.txt); the repo has no flake8 config.
lint = ".venv/bin/flake8 apps settings"
# "Eng: Monday Flowers".
# #mondayflowers-dev in the Yudame Slack, the Slack twin of its Eng group (Tom, 2026-10-25).
chats = ["telegram:-5302491300", "slack:T0B6E8JPE3C/C0CBSS3RW03"]
# The decision board: this channel's canvas of the decisions open for Tom (Tom, 2026-10-27).
board = "slack:T0B6E8JPE3C/C0CBSS3RW03"
# What each chat is for, rendered into every turn of its chat session;
rooms."telegram:-5302491300" = "The Monday Flowers site, a client's flower subscription."
rooms."slack:T0B6E8JPE3C/C0CBSS3RW03" = "The Monday Flowers site, a client's flower subscription."
machine = "Valor the Pirate"
knowledge_base = "Monday Flowers"

[env]
# STAGE skips settings/__init__.py's import of settings/local.py, which is
# gitignored and absent from a clone.
DEPLOYMENT_TYPE = "STAGE"
DJANGO_SETTINGS_MODULE = "settings"
# A placeholder for tests, not a secret.
SECRET_KEY = "valor-test-only"
