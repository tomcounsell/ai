# work-vault: Tom's work vault (Obsidian), which holds each client's invoice
# skills (`.claude/skills/*-invoice`) and the invoices themselves. Tom's
# Macs auto-sync it, so a merge here reaches his next invoice session. Added
# so the cyndra-invoice skill can end in a Mercury invoice
# (skills/valor/skills/mercury-invoicing, "Cyndra").
name = "work-vault"
client = "yudame"
repo = "https://github.com/tomcounsell/work-vault.git"
kind = "plain"
branch = "main"
merge_url = "https://github.com/tomcounsell/work-vault.git"
# No tests: the one program in the skills is the invoice renderer, so the
# suite is that it compiles.
suite = "python3 -m py_compile .claude/skills/yudame-invoice/render_invoice.py"
machine = "Valor the Cowboy"
