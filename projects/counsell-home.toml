# counsell-home: served by the Pirate (one Mac per client), which runs the
# kernel. `client` follows the old config's owner; Tom may
# rename it.
name = "counsell-home"
client = "counsell"
repo = "https://github.com/tomcounsell/counsell-home.git"
# A monorepo. The Kotlin device controller and the Flutter chat app have no
# toolchain on the Pirate, so the suite is server/llm-proxy's, the one
# Python package with tests (no uv.lock; its .venv is gitignored).
kind = "python-uv"
branch = "main"
merge_url = "https://github.com/tomcounsell/counsell-home.git"
setup = ["cd server/llm-proxy && uv venv -q --python 3.12 && uv pip install -q -e '.[test]'"]
# Its tests mock the upstream, so no credential or service is needed. 28
# pass at main on 2026-10-16.
suite = "cd server/llm-proxy && .venv/bin/python -m pytest -p no:cacheprovider -q --junitxml={junit} tests"
# "Eng: Counsell Home".
# #counsell-home-dev in the Yudame Slack, the Slack twin of its Eng group (Tom, 2026-10-25).
chats = ["telegram:-5174105183", "slack:T0B6E8JPE3C/C0CC2PX7QTW"]
# The decision board: this channel's canvas of the decisions open for Tom (Tom, 2026-10-27).
board = "slack:T0B6E8JPE3C/C0CC2PX7QTW"
# What each chat is for, rendered into every turn of its chat session;
rooms."telegram:-5174105183" = "Tom's home network and servers."
rooms."slack:T0B6E8JPE3C/C0CC2PX7QTW" = "Tom's home network and servers."
machine = "Valor the Pirate"
