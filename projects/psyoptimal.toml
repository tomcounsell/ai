# psyoptimal: served by the Captain (the old fleet's owner; one Mac per
# client). No kernel runs as "Valor the Captain" until that Mac's own
# install, so this spec and its chat are inert until then. Its client is
# open for Tom. From the draft in docs/plans/cutover-data.md, section 2.1.
name = "psyoptimal"
repo = "https://github.com/yudame/psyoptimal.git"
kind = "django"
# The default branch and the base of its merged pull requests; `prod` is
# the deploy branch.
branch = "main"
merge_url = "https://github.com/yudame/psyoptimal.git"
services = ["postgres"]
setup = ["PATH=\"$PATH:/opt/homebrew/opt/postgresql@18/bin\" SDKROOT=/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk uv sync --frozen"]
suite = "uv run pytest -p no:cacheprovider -q --junitxml={junit} apps/team apps/public apps/api"
# "Eng: PsyOPTIMAL".
chats = ["telegram:-1003743854645"]
machine = "Valor the Captain"

[env]
UV_PYTHON = "3.12"
DJANGO_SETTINGS_MODULE = "settings.test"
