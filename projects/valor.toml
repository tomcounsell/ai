[env]
# Its Sentry project; the turn's sentry-cli is Valor's own login (org yudame).
SENTRY_PROJECT = "valor"
VALOR_PGHOST = "127.0.0.1"
VALOR_PGPORT = "{port}"
VALOR_PG_OWNER = "app"
VALOR_PG_PASSFILE = "{passfile}"
VALOR_PG_SCRATCH = "/tmp"
VALOR_TEST_DB = "app_test"
