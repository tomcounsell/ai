# This repository, as the kernel builds it after takeover. The rebuild lands
# on `branch` until cutover; a task started by a message has no `--branch`,
# so the spec names it, and `python -m core start ... --project valor
# --branch B` still overrides it. The merge lands on merge_url, from the
# kernel mirror with the GitHub credential, only for a (URL, branch) pair
# Tom granted with `python -m core merge-target add`, and never on the
# remote's default branch.
name = "valor"
branch = "valor-cori-rebuild"
repo = "https://github.com/tomcounsell/ai.git"
kind = "python-uv"
services = ["postgres"]
roles = ["valor_kernel"]
setup = ["uv sync --frozen"]
suite = "uv run pytest -q -p no:cacheprovider --junitxml={junit}"
lint = "uv run ruff check ."
merge_url = "https://github.com/tomcounsell/ai.git"
# The operator group "Valor rebuild", received on the build Mac.
chats = ["telegram:-1003890616618"]
machine = "Mac"

[env]
VALOR_PGHOST = "127.0.0.1"
VALOR_PGPORT = "{port}"
VALOR_PG_OWNER = "app"
VALOR_PG_PASSFILE = "{passfile}"
VALOR_PG_SCRATCH = "/tmp"
VALOR_TEST_DB = "app_test"
