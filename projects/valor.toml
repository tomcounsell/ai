# This repository, as the kernel builds it after takeover. The rebuild's
# branch is given at start (`python -m core start ... --project valor
# --branch <the rebuild branch>`). The merge lands on merge_url, from the
# kernel mirror with the GitHub credential, only for a (URL, branch) pair
# Tom granted with `python -m core merge-target add`, and never on the
# remote's default branch.
name = "valor"
repo = "https://github.com/tomcounsell/ai.git"
kind = "python-uv"
services = ["postgres"]
roles = ["valor_kernel"]
setup = ["uv sync --frozen"]
suite = "uv run pytest -q -p no:cacheprovider --junitxml={junit}"
lint = "uv run ruff check ."
merge_url = "https://github.com/tomcounsell/ai.git"

[env]
VALOR_PGHOST = "127.0.0.1"
VALOR_PGPORT = "{port}"
VALOR_PG_OWNER = "app"
VALOR_PG_PASSFILE = "{passfile}"
VALOR_PG_SCRATCH = "/tmp"
VALOR_TEST_DB = "app_test"
