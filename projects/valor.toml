# This repository, as the kernel builds it. A task started by a message has
# no `--branch`, so the spec names it, and `python -m core start ... --project valor
# --branch B` still overrides it. The merge lands on merge_url at that
# branch, from the kernel mirror with the GitHub credential.
name = "valor"
# An internal Yudame project: its memory records carry this client.
client = "yudame"
branch = "main"
repo = "https://github.com/tomcounsell/ai.git"
kind = "python-uv"
services = ["postgres"]
roles = ["valor_kernel", "valor_memory"]
setup = ["uv sync --frozen"]
suite = "uv run pytest -q -n auto -p no:cacheprovider --junitxml={junit}"
lint = "uv run ruff check ."
merge_url = "https://github.com/tomcounsell/ai.git"
