# This repository, as the kernel builds it. A task started by a message has
# no `--branch`, so the spec names it, and `python -m core start ... --project valor
# --branch B` still overrides it. The merge lands on merge_url at that
# branch, from the kernel mirror with the GitHub credential.
name = "valor"
# An internal Yudame project: its memory records carry this client.
client = "yudame"
branch = "main"
repo = "https://github.com/tomcounsell/ai.git"
kind = "python-uv"
services = ["postgres"]
roles = ["valor_kernel", "valor_memory"]
setup = ["uv sync --frozen"]
suite = "uv run pytest -q -n auto -p no:cacheprovider --junitxml={junit}"
lint = "uv run ruff check ."
merge_url = "https://github.com/tomcounsell/ai.git"
# The operator group, the Eng group, and Tom's own DM, received on the
# Cowboy; the outside groups "Agent Builders Chat" and "Perplexity Build
# Comp"; Kevin's DM, as he works with Tom on Valor (each other DM is under
# the project its person works on; Tom, 2026-10-24 and 10-25); #general in
# the Yudame Slack, for general Yudame business (Tom, 2026-10-23);
# #valor-dev, the Slack twin of Eng: Valor (Tom, 2026-10-25); and Tom's own
# Slack DM, owned only here, as his Telegram DM is.
chats = [
    "telegram:-1003890616618", "telegram:-1003449100931", "telegram:179144806",
    "telegram:-1003879986445", "telegram:-1003936769817",
    "telegram:577036901", "slack:T0B6E8JPE3C/C0B67T44KEF",
    "slack:T0B6E8JPE3C/C0CBTQ76PRB", "slack:T0B6E8JPE3C/U0B78H17XQ8",
]
# The decision board: this channel's canvas of the decisions open for Tom (Tom, 2026-10-27).
board = "slack:T0B6E8JPE3C/C0CBTQ76PRB"
# Team chats wait to be mentioned (Tom, 2026-10-17).
mentions = ["telegram:-1003879986445", "telegram:-1003936769817", "slack:T0B6E8JPE3C/C0B67T44KEF"]
# What each chat is for, rendered into every turn of its chat session;
# Tom's DM's is his own chat's (core/intake.py).
rooms."telegram:-1003890616618" = "Status and approvals across all projects; work no chat started reports here."
rooms."telegram:-1003449100931" = "Engineering on Valor itself."
rooms."telegram:-1003879986445" = "Agent Builders Chat, a public group about building agents, where you talk as a teammate. No engineering or SDLC work starts here; web search and filing GitHub issues are fine; engineering requests go to Eng: Valor."
rooms."telegram:-1003936769817" = "Perplexity Build Comp, an outside group around a Perplexity build competition, where you talk as a teammate. No engineering or SDLC work starts here; web search and filing GitHub issues are fine; engineering requests go to Eng: Valor."
rooms."telegram:577036901" = "A direct message with Kevin, who works with Tom on Valor. No engineering or SDLC work starts here; web search and filing GitHub issues are fine; engineering requests go to Eng: Valor."
rooms."slack:T0B6E8JPE3C/C0B67T44KEF" = "#general in the Yudame Slack, the company's team chat for general Yudame business; answer whoever mentions you. No engineering or SDLC work starts here; web search and filing GitHub issues are fine; engineering requests go to the Eng group of the project they are about, else Tom."
rooms."slack:T0B6E8JPE3C/C0CBTQ76PRB" = "Engineering on Valor itself."
machine = "Valor the Cowboy"

[env]
# Its Sentry project; the turn's sentry-cli is Valor's own login (org yudame).
SENTRY_PROJECT = "valor"
VALOR_PGHOST = "127.0.0.1"
VALOR_PGPORT = "{port}"
VALOR_PG_OWNER = "app"
VALOR_PG_PASSFILE = "{passfile}"
VALOR_PG_SCRATCH = "/tmp"
VALOR_TEST_DB = "app_test"
