# mastery: Pursue Mastery's monorepo, built from scratch, served by the
# Captain with psyoptimal, whose company collaborates with Mastery's (Tom,
# 2026-10-22). Its existing repositories, mastery-be (the FastAPI backend)
# and v1-nadal (the Ionic app), are read-only submodules: the kernel's clone
# and its diffs skip submodules, so nothing under them merges, and Valor's
# triage access there is enough to read them.
name = "mastery"
client = "mastery"
repo = "https://github.com/Pursue-Mastery/mastery.git"
kind = "plain"
branch = "main"
merge_url = "https://github.com/Pursue-Mastery/mastery.git"
setup = ["git submodule update --init --depth 1"]
# No code of its own yet: the suite is replaced by the first real test
# command.
suite = "true"
# "Eng: Mastery", the group made 2026-10-22 (two older groups share the name).
# #mastery-dev in the Yudame Slack, the Slack twin of its Eng group (Tom, 2026-10-25).
chats = ["telegram:-5565152737", "slack:T0B6E8JPE3C/C0CBHMR5FHV"]
rooms."telegram:-5565152737" = "Engineering on Pursue Mastery's new monorepo. mastery-be/ (the FastAPI backend) and v1-nadal/ (the Ionic app) are read-only submodules of Pursue-Mastery's existing repositories; changes to them go to those repositories, not here."
rooms."slack:T0B6E8JPE3C/C0CBHMR5FHV" = "Engineering on Pursue Mastery's new monorepo. mastery-be/ (the FastAPI backend) and v1-nadal/ (the Ionic app) are read-only submodules of Pursue-Mastery's existing repositories; changes to them go to those repositories, not here."
machine = "Valor the Captain"
knowledge_base = "Mastery"
