# yudame: the yuda.me website, served by the Pirate, which runs the kernel. `client` follows the old config's owner; Tom may
# rename it.
name = "yudame"
client = "yudame"
repo = "https://github.com/yudame/yuda.me.git"
kind = "node"
branch = "main"
merge_url = "https://github.com/yudame/yuda.me.git"
setup = ["npm ci"]
# A static Tailwind site with no tests and no JUnit reporter: the suite is
# the build its deploy workflow runs, judged by its exit alone.
suite = "npm run build"
# "Yudame", the company's team chat, which waits to be mentioned (Tom,
# 2026-10-17).
chats = ["telegram:-4719889199"]
mentions = ["telegram:-4719889199"]
# What each chat is for, rendered into every turn of its chat session;
rooms = { "telegram:-4719889199" = "The company's team chat, with Lewis and Rain; answer whoever mentions you. No engineering or SDLC work starts here; web search and filing GitHub issues are fine; engineering requests go to the Eng group of the project they are about, else Tom." }
machine = "Valor the Pirate"
knowledge_base = "Yudame"
