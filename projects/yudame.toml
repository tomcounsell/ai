# yudame: the yuda.me website, served by the Pirate, which runs the kernel. `client` follows the old config's owner; Tom may
# rename it. Its chats also work in the repositories `projects` lists.
name = "yudame"
client = "yudame"
repo = "https://github.com/yudame/yuda.me.git"
kind = "node"
branch = "main"
merge_url = "https://github.com/yudame/yuda.me.git"
setup = ["npm ci"]
# A static Tailwind site with no tests and no JUnit reporter: the suite is
# the build its deploy workflow runs, judged by its exit alone.
suite = "npm run build"
# "Yudame", the company's team chat, which waits to be mentioned (Tom,
# 2026-10-17).
# #yudame-dev in the Yudame Slack, engineering on the site (Tom, 2026-10-25)
# and on the Yudame Tools Mac app (Tom, 2026-10-28).
chats = ["telegram:-4719889199", "slack:T0B6E8JPE3C/C0CBX4MBN1L"]
# The decision board: this channel's canvas of the decisions open for Tom (Tom, 2026-10-27).
board = "slack:T0B6E8JPE3C/C0CBX4MBN1L"
mentions = ["telegram:-4719889199"]
# The other repositories its chats work in: a task they start runs under
# one of these when the request is about it, and the board covers their
# tasks (Tom, 2026-10-28). One spec and one name here add another.
projects = ["yudame-tools"]
# What each chat is for, rendered into every turn of its chat session;
rooms."telegram:-4719889199" = "The company's team chat, with Lewis and Rain; answer whoever mentions you. No engineering or SDLC work starts here; web search and filing GitHub issues are fine; engineering requests go to the Eng group of the project they are about, else Tom."
rooms."slack:T0B6E8JPE3C/C0CBX4MBN1L" = "Engineering on the yuda.me company site (yudame/yuda.me) and the Yudame Tools menu-bar Mac app (yudame/yudame-tools)."
machine = "Valor the Pirate"
knowledge_base = "Yudame"
