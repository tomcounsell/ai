# yudame-tools: Yudame Tools, the team's menu-bar Mac app (Swift, macOS 26),
# worked on from #yudame-dev, whose spec (yudame.toml) lists it in `projects`
# (Tom, 2026-10-28). No chats of its own: the channel keeps one owner. On the
# Pirate, with the yudame project that lists it; Xcode 27.1 there (Tom,
# 2026-10-28).
name = "yudame-tools"
client = "yudame"
repo = "https://github.com/yudame/yudame-tools.git"
kind = "plain"
branch = "main"
merge_url = "https://github.com/yudame/yudame-tools.git"
# SwiftPM's own sandbox cannot nest in a turn's (the repo's CLAUDE.md). The
# tests are Swift Testing only: without --disable-xctest, --xunit-output X
# writes X-swift-testing.xml and nothing at X.
suite = "swift test --disable-sandbox --disable-xctest --scratch-path .build/valor --xunit-output {junit}"
machine = "Valor the Pirate"
knowledge_base = "Yudame"
