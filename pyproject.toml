[project]
name = "valor"
version = "0.0.1"
description = "Valor: one AI employee, corrigible by construction."
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.12",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["hypothesis>=6", "pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["spend(usd): the most live money one run of the test may cost"]

[tool.ruff]
line-length = 110
