[project]
name = "valor"
version = "0.0.1"
description = "Valor: one AI employee, corrigible by construction."
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.12",
    "psycopg[binary]>=3.2",
    "telethon>=1.40",
]

[dependency-groups]
dev = ["hypothesis>=6", "pytest>=8", "ruff==0.16.10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# tests/bridges.py would otherwise shadow the top-level bridges package
addopts = "--import-mode=importlib"
markers = [
    "spend(usd): the money one run of the test is expected to cost",
    "macos: needs macOS itself; skipped off Darwin",
    "container: needs Apple's container; skipped where it is not installed",
]

[tool.ruff]
line-length = 110
