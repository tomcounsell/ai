[project]
name = "valor"
version = "0.0.1"
description = "Valor: one AI employee, corrigible by construction."
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.4",
    "onnx-asr[cpu,hub]>=0.12",
    "popoto[postgres]==1.10.1",
    "psycopg[binary]>=3.2",
    "slack-sdk>=3.45.0",
    "telethon>=1.40",
]

[dependency-groups]
dev = [
    "hypothesis>=6",
    "pytest>=8",
    "pytest-xdist>=3.8",
    "ruff==0.16.10",
    "vulture>=2.16",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# tests/bridges.py would otherwise shadow the top-level bridges package
addopts = "--import-mode=importlib -p no:popoto"
markers = [
    "spend(usd): the money one run of the test is expected to cost",
]

[tool.ruff]
line-length = 110

# tests/test_bloat.py: production code nothing in production uses fails the
# suite. The names below are reached from outside the code vulture reads:
# parser callbacks (HTMLParser, expat), popoto's Meta and fields, psycopg's
# connection attribute, and record fields stored or listed, never read back.
[tool.vulture]
paths = ["core", "harnesses", "bridges", "routines", "tools", "ui", "api", "memory", "scripts"]
min_confidence = 60
ignore_names = [
    "handle_*", "*DeclHandler", "Meta", "words", "isolation_level",
    "created_at", "error_cost", "on_abstain", "consumer", "serves",
]
