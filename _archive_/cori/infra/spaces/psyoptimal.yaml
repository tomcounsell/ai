# The first space: the PsyOptimal client engagement. Architecture §9,
# values from docs/prereqs.md. Inside the trust boundary.

id: psyoptimal
kind: client
roots:
  - github.com/yudame/psyoptimal
  - ~/work-vault/PsyOptimal
# Architecture §4 (2026-09-20): read | propose | act. Proposals leave the
# space through the broker from M2; an act needs a passkey at M3.
max_effect_class: propose
allowed_targets:
  - github.com/yudame
  - mailto:tom@yuda.me
retention:
  memory_days: 365
  artifacts_days: 365
connectors:
  - kind: gmail
    account: tom@yuda.me
    route:
      sender_domain: psyoptimal.com
secrets: []
# No budget here. The budget is money per objective, estimated by the
# supervisor at framing (architecture §4, 2026-09-20).
# Who an outbound message may go to (seams §1.1). The README's Contacts table
# carries no addresses today, so the domain stands for the engagement.
audience:
  addresses: []
  domains:
    - psyoptimal.com
  source: "~/work-vault/PsyOptimal/README.md#contacts"
