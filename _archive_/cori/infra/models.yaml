# Seat file. Tech stack §4.1. Inside the trust boundary: editing this file is
# reviewed like kernel code, and at M3 it is passkey-gated.
#
# Ids are what the Models API returns as concrete ids on 2026-09-19. Models
# from the 4.6 generation on carry no date in the id; the API's created_at is
# the fixed thing a ledger row can cite, so it is recorded here. Haiku 4.5 is
# the last id with a date.
#
# min_cache_prefix: the smallest prefix Anthropic will cache on that model,
# in tokens. Shorter prefixes silently write nothing. The Context Builder
# places its first breakpoint at or beyond the resolved model's value.
# Documented values, checked on 2026-09-19 by probing cache_creation_input_tokens
# either side of each: Opus 5 wrote 0 at a 499-token prefix and 535 at 541;
# Opus 4.8 wrote 0 at 1,018 and 1,053 at 1,059; Haiku 4.5 wrote 0 at 3,908
# and 4,101 at 4,108 (spike 04 had it between 4,026 and 4,247).
#
# usd_per_mtok: US dollars per million tokens, from the provider's public
# pricing page (platform.claude.com/docs/en/about-claude/pricing). cache_write
# is the 5 minute write rate, cache_read the cache hit rate. Every seated model
# carries all four; the loader refuses a seat whose model has none. A price
# change is a reviewed edit to this file, like a model change.

models:
  - id: claude-opus-5
    family: opus
    generation: n
    created_at: 2026-07-24
    max_input_tokens: 1000000
    max_output_tokens: 128000
    min_cache_prefix: 512
    usd_per_mtok: # checked 2026-09-21
      input: 5.00
      output: 25.00
      cache_write: 6.25
      cache_read: 0.50
  - id: claude-opus-4-8
    family: opus
    generation: n-1
    created_at: 2026-05-28
    max_input_tokens: 1000000
    max_output_tokens: 128000
    min_cache_prefix: 1024
    usd_per_mtok: # checked 2026-09-21
      input: 5.00
      output: 25.00
      cache_write: 6.25
      cache_read: 0.50
  - id: claude-haiku-4-5-20251001
    family: haiku
    generation: n-1
    created_at: 2025-10-15
    max_input_tokens: 200000
    max_output_tokens: 64000
    min_cache_prefix: 4096
    usd_per_mtok: # checked 2026-09-21
      input: 1.00
      output: 5.00
      cache_write: 1.25
      cache_read: 0.10

seats:
  frontier: claude-opus-5 # supervisor, Executor, Planner
  verifier:
    # Never the executor's snapshot. The previous generation of the same
    # family is the nearest independent model on one provider. `screened`
    # flips to true when the seat passes the fixture screen at M1; until
    # then the loader lets only an older model sit here.
    model: claude-opus-4-8
    screened: false
  summarizer: claude-haiku-4-5-20251001 # Scribe, thread summaries

# Not seated. claude-fable-5-1 is the most capable id on the key; it sits in
# a higher price tier, keeps thinking always on, and refuses forced tool use.
# The frontier seat moves there when a measured task class shows the gap is
# worth the price.
