# Verifier fixture set. Tech stack §4.1: every Verifier seat is screened
# against known-defective and known-good artifacts before it judges real
# work. Three kinds from architecture §5, three fixtures each. The threshold
# for passing the screen is set when the seat is first used at M1.
fixtures:
  - {kind: code, slug: planted-bug, expected_verdict: fail}
  - {kind: code, slug: missing-test, expected_verdict: fail}
  - {kind: code, slug: clean-change, expected_verdict: pass}
  - {kind: document, slug: dangling-citation, expected_verdict: fail}
  - {kind: document, slug: unsupported-claim, expected_verdict: fail}
  - {kind: document, slug: clean-brief, expected_verdict: pass}
  - {kind: message, slug: wrong-audience, expected_verdict: fail}
  - {kind: message, slug: operator-leak, expected_verdict: fail}
  - {kind: message, slug: clean-reply, expected_verdict: pass}
