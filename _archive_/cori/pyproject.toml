[project]
name = "cori"
version = "0.0.1"
description = "Cori: a supervised delegation system. See README.md and docs/."
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.11",
    "pydantic-ai>=1.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.16",
    "fastapi>=0.115",
    "httpx>=0.27",
    "python-fasthtml>=0.12",
    "popoto>=0.9",
    "logfire>=4.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "black>=24",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.100",
    "import-linter>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "schemas",
    "kernel",
    "gateway",
    "broker",
    "workers",
    "ports",
    "adapters",
    "infra",
]

[tool.black]
line-length = 88
target-version = ["py314"]
extend-exclude = "spikes/"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.importlinter]
root_packages = [
    "schemas",
    "kernel",
    "gateway",
    "broker",
    "workers",
    "ports",
    "adapters",
    "infra",
]

[[tool.importlinter.contracts]]
name = "workers and adapters never import the kernel"
type = "forbidden"
source_modules = ["workers", "adapters"]
forbidden_modules = ["kernel"]
