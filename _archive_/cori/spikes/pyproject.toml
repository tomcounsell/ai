[project]
name = "cori-spikes"
version = "0.0.1"
description = "Proof-of-concept spikes behind the Cori design assumptions"
requires-python = ">=3.14"
dependencies = [
    "psycopg[binary]>=3.2",
    "hypothesis>=6.100",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "black>=24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.black]
line-length = 88
target-version = ["py314"]
