name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: cori
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CORI_MIGRATOR_DSN: postgresql://postgres@localhost:5432/cori
      CORI_PGHOST: localhost
      CORI_PGPORT: "5432"
      CORI_PGDATABASE: cori
      CORI_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - run: uv sync --frozen
      - run: uv run black --check .
      - run: uv run lint-imports
      - run: uv run alembic upgrade head
      - run: uv run pytest -q
