# ---------------------------------------------------------------------------
# Global scope (user-level) — the 3 deployed SDLC-fork entries
#
# These forks (.claude/hooks/sdlc/*.py) are import-free of this repo's
# hook_utils and are hardlinked to ~/.claude/hooks/sdlc/ by
# scripts/update/hardlinks.py::sync_user_hooks so they can run inside foreign
# repos' Claude Code sessions (spike-4B: load-bearing fork, do NOT unify with
# the project twins of the same script name).
#
# MIN_GLOBAL_PYTHON OBLIGATION (issue #2503): global-scope scripts run under a
# resolved absolute system python3 (NOT the repo venv), whose worst case on the
# fleet is /usr/bin/python3 = 3.9 on macOS. Anyone adding a FOURTH global hook
# here must ensure its script imports and runs clean under
# scripts/update/hardlinks.py::MIN_GLOBAL_PYTHON — no PEP 604 (`X | None`)
# annotations without `from __future__ import annotations`, no datetime.UTC,
# tomllib, typing.Self, ExceptionGroup, or asyncio.timeout, and stdlib-only
# imports. An always-on AST test enforces this; do not rely on convention.
# ---------------------------------------------------------------------------

# Renamed from sdlc/validate_commit_message.py to disambiguate from the
# different check at validators/validate_commit_message.py (co-author/empty
# message vs code-to-main block) — see docs/plans/
# hook-registration-manifest-dispatcher.md spike-4B. NOTE for the migration
# builder (build-migration): the string "validate_commit_message.py" (the
# OLD/deployed filename, no "_sdlc" suffix) is still needed verbatim as the
# legacy-fallback literal when matching what is already on disk in
# ~/.claude/hooks/sdlc/ on every machine that has previously run /update.
[[hook]]
manifest_id = "validate_commit_message_fork"
event = "PreToolUse"
matcher = "Bash"
script = "sdlc/validate_commit_message_sdlc.py"
timeout = 10
scope = "global"
exit_policy = "propagate"

# Deployed-reality baseline fix: the two _SDLC_HOOK_DEFS tuples for this
# script ("PostToolUse","Write",...) and ("PostToolUse","Edit",...) emit a
# byte-identical command, so the legacy command-string dedupe collapsed them
# to a single Edit-matched block on every machine — Write coverage was
# silently dropped. Declared here ONCE with "Write|Edit" to restore it.
[[hook]]
manifest_id = "sdlc_reminder_fork"
event = "PostToolUse"
matcher = "Write|Edit"
script = "sdlc/sdlc_reminder.py"
timeout = 10
scope = "global"
exit_policy = "suppress"

# Pre-requisite Bug 1 fix: the deployed user-scope entry for this script had
# no guard (unlike its project twin), so a non-zero exit blocked the agent's
# turn-end fleet-wide. exit_policy="suppress" restores the guard, and matches
# the deliberate suppression on the project-scope `validate_sdlc_on_stop`.
[[hook]]
manifest_id = "validate_sdlc_on_stop_fork"
event = "Stop"
matcher = ""
script = "sdlc/validate_sdlc_on_stop.py"
timeout = 15
scope = "global"
exit_policy = "suppress"
