# Hook registration manifest — single source of truth for static Claude Code
# hook registration across both scopes (project `.claude/settings.json` and
# user `~/.claude/settings.json`).
#
# See docs/plans/hook-registration-manifest-dispatcher.md and (once written)
# docs/features/hook-manifest.md for the full design.
#
# Field reference:
#   event       - Claude Code hook event name (UserPromptSubmit, PreToolUse,
#                 PostToolUse, Stop, SubagentStop, PostCompact)
#   matcher     - tool-name matcher string ("" = all tools; supports the
#                 regex-alternation form "Write|Edit")
#   script      - path to the hook script, relative to .claude/hooks/
#   timeout     - seconds, passed through verbatim to the generated command
#   scope       - "project" -> rewrites .claude/settings.json
#                 "global"  -> hardlinked to ~/.claude/hooks/ and rewrites
#                               ~/.claude/settings.json (scripts/update/hardlinks.py)
#   exit_policy - what this hook's non-zero exit is allowed to do to the
#                 harness. Claude Code reads exit 2 as a structured DENY
#                 (block the tool call / block turn-end) and every other
#                 non-zero exit as "the hook errored, carry on" (#2527):
#                 "propagate" -> registered bare; every non-zero exit reaches
#                                the harness, a crash included
#                 "deny-only" -> a crash is mapped to 0, exit 2 is passed
#                                through. Use when the hook owns its own
#                                fail-open internally and its exit 2 is a
#                                real decision to block
#                 "suppress"  -> no non-zero exit reaches the harness. Use
#                                when the hook's exit 2 is a loud stderr
#                                warning rather than a decision to block
#   manifest_id - stable slug used as the add/update/remove identity key by
#                 the generators (NOT the volatile command string). Must be
#                 unique across the whole manifest.
#   args        - optional list of extra CLI argv tokens appended to the
#                 command, exactly as originally invoked (e.g.
#                 validate_file_contains.py's `-d`/`-e`/`--contains` flags).
#
# Declaration order is the canonical ordering (see plan's "Technical
# Approach" section): the generators emit entries in this order and update
# in place by manifest_id without resorting. This is load-bearing for the
# empty-`git diff`-on-regen guarantee — do not reorder entries casually.

# ---------------------------------------------------------------------------
# UserPromptSubmit
# ---------------------------------------------------------------------------

[[hook]]
manifest_id = "user_prompt_submit"
event = "UserPromptSubmit"
matcher = ""
script = "user_prompt_submit.py"
timeout = 15
scope = "project"
exit_policy = "suppress"

# ---------------------------------------------------------------------------
# PreToolUse
# ---------------------------------------------------------------------------

[[hook]]
manifest_id = "pre_tool_use"
event = "PreToolUse"
matcher = ""
script = "pre_tool_use.py"
timeout = 5
scope = "project"
# deny-only (#2527): this script owns its fail-open internally — every check
# wraps its own logic in `except Exception` and returns, so the only exit 2 it
# can produce is a deliberate block (`_enforce_tool_budget`'s per-tool budget
# backstop and `_enforce_foreground_subagents`' #2420 guard). Under the old
# blanket `|| true` both were registered and inert.
exit_policy = "deny-only"

# Consolidated dispatcher (issue #2435): replaces the 7 separate PreToolUse
# validator declarations that used to live here (validate_commit_message,
# validate_no_inline_timeout, validate_merge_guard, validate_no_raw_redis_delete,
# validate_no_uv_sync_in_worktree, validate_no_destructive_git_in_worktree,
# validate_design_system_sync) with a single in-process dispatcher
# (.claude/hooks/dispatch/pre_tool_use_bash.py) that runs 9 in-process
# predicates (the original 6 plus validate_no_destructive_git_in_shared_checkout,
# added by issue #2448; validate_no_broad_process_kill, added by issue #2562;
# and validate_no_redis_flush, added by issue #2645 to block unconditional
# `.flushdb()`/`.flushall()`/`redis-cli ... FLUSHDB`/`FLUSHALL` call shapes)
# plus the 1 out-of-process subprocess call in the exact order above,
# first-block-wins. exit_policy="propagate" matches validate_merge_guard's
# pre-existing fail-closed semantics (no guard masking its exit).
# timeout=20 covers the dispatcher's own out-of-process leg
# (validate_design_system_sync's internal 15s subprocess timeout) plus
# headroom for the 9 fast in-process predicates -- provisional/tunable, see
# docs/plans/hook-registration-manifest-dispatcher.md. Re-confirmed for the
# 9th predicate (issue #2645): validate_no_redis_flush is a handful of regex
# searches over the command string with no I/O, well inside the existing
# headroom -- the budget increase risk is dominated entirely by the
# out-of-process design-system-sync leg, unchanged by this addition.
# Re-confirmed for the 10th predicate (issue #2866): validate_no_module_scope_env
# fires only on `git commit`, and on that path does two whole-commit `git` reads
# (`git diff --cached --name-only`, `git diff --cached -U0 -M`) plus one
# `git show :path` and one `ast.parse` per staged non-test .py file -- bounded by
# the size of a single commit, each git call self-capped at 10s, and still
# dominated by the out-of-process design-system-sync leg. timeout=20 stands
# unchanged.
[[hook]]
manifest_id = "dispatch_pre_tool_use_bash"
event = "PreToolUse"
matcher = "Bash"
script = "dispatch/pre_tool_use_bash.py"
timeout = 20
scope = "project"
exit_policy = "propagate"

[[hook]]
manifest_id = "validate_design_system_readonly"
event = "PreToolUse"
matcher = "Write|Edit"
script = "validators/validate_design_system_readonly.py"
timeout = 5
scope = "project"
exit_policy = "propagate"

