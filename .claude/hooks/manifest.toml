# Deliberate fix (Technical Approach "Deployed-reality baseline"): declared
# ONCE with the alternation matcher "Write|Edit" instead of as two separate
# Write and Edit entries — the project settings.json previously carried this
# script twice (identical command, two matcher blocks); the user/global scope
# twin collapsed to a single Edit-matched block via a command-string dedup
# quirk, silently dropping Write coverage. One manifest entry -> one on-disk
# block per scope, restoring the intended Write coverage everywhere.
[[hook]]
manifest_id = "sdlc_reminder"
event = "PostToolUse"
matcher = "Write|Edit"
script = "sdlc_reminder.py"
timeout = 10
scope = "project"
exit_policy = "suppress"

# Hardlink auto-repair (2026-07-31 hotfix, merged from main): Write/Edit
# replace-and-rename breaks the skills-global hardlink, silently leaving the
# live skill on pre-edit text; this relinks after every Write/Edit.
[[hook]]
manifest_id = "relink_global_skills"
event = "PostToolUse"
matcher = "Write|Edit"
script = "validators/relink_global_skills.py"
timeout = 10
scope = "project"
exit_policy = "suppress"

# ---------------------------------------------------------------------------
# Stop
# ---------------------------------------------------------------------------

[[hook]]
manifest_id = "stop"
event = "Stop"
matcher = ""
script = "stop.py"
timeout = 10
scope = "project"
exit_policy = "suppress"
args = ["--chat"]

# suppress, deliberately (#2527 audit): this script calls sys.exit(2) when the
# quality commands were not run, but a Stop-event exit 2 blocks turn-end. The
# standing decision is that a missed quality gate is a loud stderr warning, not
# a wedged turn — the guard has masked that exit since the manifest was built
# and stays masked. Its twin `validate_sdlc_on_stop_fork` matches.
[[hook]]
manifest_id = "validate_sdlc_on_stop"
event = "Stop"
matcher = ""
script = "validators/validate_sdlc_on_stop.py"
timeout = 15
scope = "project"
exit_policy = "suppress"

