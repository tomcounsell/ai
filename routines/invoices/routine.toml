name = "invoices"
runner = "task"
ceiling = "act"
model = "frontier"
mission_item = "Tom's ask (rule 2): reminders to Yudame's clients who haven't paid"
need = [
    "Tom, 2026-10-21 (Telegram 11674, 11676): send reminders to those that haven't paid, from Valor's Google account",
    "Mercury deletes an API token unused for 45 days; this weekly call is its use",
]
created = 2026-10-21
project = "valor"
branch = "main"
# Its result wakes the session it reports to, which sends the reminders the run drafted:
# only a chat session sends (docs/plans/one-voice.md).
wakes = true
instruction = """Draft this week's reminders for Yudame's unpaid Mercury invoices (skills/valor/skills/mercury-invoicing/SKILL.md). You send nothing: the session you report to sends them.

Run `python3 skills/valor/skills/mercury-invoicing/mercury.py remind`. Write `.valor/stop.md`: `Done:`, then for each item of its `send` list, unchanged, one fenced `json` block holding that `email.send` effect (its PDF stays where the script wrote it, in this workspace), then each invoice in `for_tom` (past its fourth reminder) with its customer, amount and days overdue. With nothing to send, `Done: no reminders due`. If the script fails, stop with `Done: no reminders drafted`, then its error."""

[schedule]
weekday = 1
hour = 9
minute = 0
